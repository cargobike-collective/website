name: Animation
icon: video
preview: fields

fields:
  file:
    label: Lottie-Datei
    type: files
    query: page.files.filterBy("template", "animation")
    multiple: false
    max: 1
    uploads:
      template: animation
    help: Lottie-Animation (.lottie oder .json).
  height:
    label: Höhe (px)
    type: number
    default: 500
    min: 0
    width: 1/3
  loop:
    label: Endlosschleife
    type: toggle
    default: true
    width: 1/3
  autoplay:
    label: Autoplay
    type: toggle
    default: true
    width: 1/3
  sectionBackground:
    label: Hintergrundfarbe
    type: color
    mode: options
    options:
      "#f0ff39": Signal-Gelb
      "#f0fc62": Hellgrün
      "#23282b": Asphalt
      "#f8f9ff": Off-White
    help: Optional – Hintergrundfarbe über die volle Breite.
    width: 1/2
  anchor:
    extends: fields/anchor
    width: 1/2
