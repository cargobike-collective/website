name: Hero
icon: image
preview: image

fields:
  image:
    label: Bild
    type: files
    query: page.images
    multiple: false
    max: 1
    uploads:
      template: image
  alt:
    label: Alt-Text
    type: text
    help: Bildbeschreibung für Screenreader und SEO.
  height:
    label: Höhe
    type: select
    default: large
    options:
      large: Groß (85vh)
      medium: Mittel (60vh)
      small: Klein (40vh)
      auto: Original-Bildverhältnis
    width: 1/2
  anchor:
    label: Anker-ID
    type: text
    default: start
    width: 1/2
