title: Event

# Sort events chronologically by their date.
num: '{{ page.date.toDate("Ymd") }}'

options:
  preview: true

fields:
  dateHeadline:
    label: Datum & Ort
    type: headline
  date:
    label: Datum
    type: date
    time: true
    display: DD.MM.YYYY
    width: 1/2
  tags:
    label: Tags
    type: tags
    separator: ","
    width: 1/2
    options:
      type: query
      query: site.find("events").children.pluck("tags", ",", true)
    help: 'Schlagwort zum Gruppieren und Filtern auf der Startseite – z. B. die Stadt oder die Art der Veranstaltung.'
  street:
    label: Straße & Hausnummer
    type: text
  zip:
    label: PLZ
    type: text
    width: 1/4
  addressCity:
    label: Stadt
    type: text
    width: 3/4
    help: Abweichender Ort der Veranstaltung (optional).
  contentHeadline:
    label: Inhalt
    type: headline
  cover:
    label: Bild
    type: files
    query: page.images
    multiple: false
    max: 1
    uploads:
      template: image
  text:
    label: Beschreibung
    type: textarea
    size: large
    font: sans-serif
    help: Beschreibung der Veranstaltung (optional).
    buttons:
      - headlines
      - bold
      - italic
      - link
      - ul
      - ol
  link:
    label: Button-Link
    type: link
    width: 1/2
    help: Externe URL oder interne Seite (optional).
    options:
      - url
      - page
      - email
      - tel
  buttonCaption:
    label: Button-Link Beschriftung
    type: text
    width: 1/2
    default: Zur Veranstaltung
    placeholder: Zur Veranstaltung
    help: Beschriftung des Buttons (nur relevant, wenn ein Link gesetzt ist).
