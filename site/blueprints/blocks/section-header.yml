name: Section-Header
icon: text
preview: fields

fields:
  eyebrow:
    label: Titel
    type: text
    help: Kurze Section-Überschrift (H2), klein geschrieben.
  text:
    label: Einleitungstext
    type: textarea
    size: small
    buttons:
      - bold
      - italic
      - link
  background:
    label: Streifen-Hintergrund
    type: select
    default: left
    options:
      none: Kein
      left: Links
      right: Rechts
    width: 1/3
  backgroundColor:
    label: Streifen-Farbe
    type: color
    mode: options
    default: "#f0ff39"
    options:
      "#f0ff39": Signal-Gelb
      "#f0fc62": Hellgrün
      "#23282b": Asphalt
      "#f8f9ff": Off-White
    width: 1/3
  anchor:
    label: Anker-ID
    type: text
    help: Optional, z. B. "events" oder "about". Macht den Abschnitt per "#anker" verlinkbar.
    width: 1/3
