name: Hero / Slider
icon: image
preview: image

fields:
  image:
    label: Bilder
    type: files
    query: page.images
    multiple: true
    uploads:
      template: image
    help: 'Mehrere Bilder werden automatisch zu einem Slider.'
  alt:
    label: Alt-Text
    type: text
    help: 'Fällt zurück, wenn ein Bild keinen eigenen Alt-Text hat. Für Screenreader und SEO.'
  height:
    label: Höhe
    type: select
    default: large
    options:
      large: Groß (85vh)
      medium: Mittel (60vh)
      small: Klein (40vh)
      auto: Original-Bildverhältnis
    width: 1/2
  anchor:
    label: Anker-ID
    type: text
    width: 1/2
    help: 'Leer lassen: Das erste Hero auf der Seite wird automatisch „#start".'
  autoplay:
    label: Automatisch weiterblättern
    type: toggle
    default: false
    help: 'Nur bei mehreren Bildern (Slider). Pausiert bei Interaktion.'
