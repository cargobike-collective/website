name: Deploy to netcup (dev)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys run at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # kirby/ and vendor/ are gitignored, so build them from composer.lock.
      - name: Set up PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, simplexml
          tools: composer:v2
          coverage: none

      - name: Install dependencies (builds kirby/ + vendor/)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Deploy with rsync over SSH
        env:
          # sshpass -e reads the password from $SSHPASS (no password in argv/logs).
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          REMOTE='hosting203422@hosting203422.ae93f.netcup.net'
          ROOT='/dev.cargobike-collective.org/httpdocs'
          SSH='sshpass -e ssh -p 22 -o StrictHostKeyChecking=accept-new'

          # --no-perms: netcup's rsync rejects setting permissions mid-transfer,
          # so we let the transfer succeed and fix permissions in the next step.
          rsync -rltz --delete --stats \
            --no-perms --no-owner --no-group \
            --rsync-path=/rsync \
            -e "$SSH" \
            --exclude=/.git \
            --exclude=/.github \
            --exclude=/.gitignore \
            --exclude=/.gitattributes \
            --exclude=/.editorconfig \
            --exclude=/README.md \
            --exclude=/content \
            --exclude=/media \
            --exclude=/site/accounts \
            --exclude=/site/sessions \
            --exclude=/site/cache \
            --exclude=/site/config/.license \
            --exclude=.DS_Store \
            ./ \
            "$REMOTE:$ROOT/"

          # rsync writes files with a restrictive umask, which 403s the site
          # (Apache can't even read .htaccess). Set web-readable perms (755/644).
          $SSH "$REMOTE" "chmod -R u=rwX,go=rX '$ROOT'"
