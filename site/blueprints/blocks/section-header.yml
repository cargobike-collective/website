name: Section-Header
icon: text
preview: fields

fields:
  eyebrow:
    label: Titel
    type: text
    help: Kurze Section-Überschrift (H2), klein geschrieben.
    width: 3/4
  anchor:
    label: Anker-ID
    type: text
    help: Optional, z. B. "events". Per "#anker" verlinkbar.
    width: 1/4
  text:
    label: Einleitungstext
    type: textarea
    size: small
    buttons:
      - bold
      - italic
      - link
  background:
    label: Streifen-Hintergrund
    type: select
    default: left
    options:
      none: Kein
      left: Links
      right: Rechts
    width: 1/3
  backgroundColor:
    extends: fields/color
    label: Streifen-Farbe
    default: "#f0ff39"
    width: 1/3
  sectionBackground:
    extends: fields/color
    label: Hintergrundfarbe
    help: Optional – Hintergrundfarbe des gesamten Abschnitts.
    width: 1/3
